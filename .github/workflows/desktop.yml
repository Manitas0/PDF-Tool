name: Desktop

# Builds the Windows desktop app (desktop/, Electron) for x64 and ARM64 and tests it on a real
# Windows machine. On a tag v* the installers and the portable versions are additionally published
# as a GitHub Release.

on:
  push:
    branches: ['**']
    # Path filters do not apply to tag pushes: every v* tag builds and releases.
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      # The desktop tests also use the web app's test helpers and the root dependencies
      # (@playwright/test, pdf-lib, jszip).
      - 'tests/e2e/helpers.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      # The desktop tests also use the web app's test helpers and the root dependencies
      # (@playwright/test, pdf-lib, jszip).
      - 'tests/e2e/helpers.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  # Manual start (Actions → Desktop → „Run workflow“). With „release“ ticked, the release
  # v<version from desktop/package.json> is created on the selected commit – for when tags
  # cannot be pushed.
  workflow_dispatch:
    inputs:
      release:
        description: 'Release v<Version aus desktop/package.json> erstellen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app is not code-signed: do not look for certificates on the runner.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  windows:
    name: Windows-App bauen und testen
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # File names, installer details and the „Über PDF-Tool“ dialog take the version from
      # desktop/package.json – a tag v1.2.3 must not publish files named 1.0.0.
      - name: Tag und Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in desktop/package.json – erst die Version anpassen, dann taggen."
            exit 1
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Root dependencies: @playwright/test, pdf-lib and jszip for the desktop tests.
      - name: Abhängigkeiten der Web-App installieren
        run: npm ci --omit=optional

      - name: Abhängigkeiten der Desktop-App installieren
        working-directory: desktop
        run: npm ci

      # Electron downloads its binary on first use; do it here so a failure shows up clearly.
      - name: Electron herunterladen
        working-directory: desktop
        run: node -e "console.log(require('electron'))"

      - name: End-to-End-Tests der Desktop-App
        working-directory: desktop
        run: npm test

      # Installer and portable version, each separately for x64 and ARM64 (see "build" in
      # desktop/package.json).
      - name: Windows-Installer und portable Version bauen
        working-directory: desktop
        run: npm run dist:win

      # The tests above can only start the x64 build (the runner is x64). At least make sure that
      # all four files exist and that each build contains a program for its processor: the machine
      # type in the PE header of PDF-Tool.exe is 8664 for x64 and aa64 for ARM64.
      - name: Build-Ergebnis prüfen
        working-directory: desktop/dist
        shell: bash
        run: |
          version=$(node -p "require('../package.json').version")
          for arch in x64 arm64; do
            for file in "PDF-Tool-Setup-$version-$arch.exe" "PDF-Tool-$version-portable-$arch.exe"; do
              [ -f "$file" ] || { echo "::error::$file wurde nicht gebaut"; exit 1; }
            done
          done
          check_machine() {
            local pe_offset machine
            pe_offset=$(od -An -tu4 -j60 -N4 "$1" | tr -d ' ')
            machine=$(od -An -tx2 -j$((pe_offset + 4)) -N2 "$1" | tr -d ' ')
            [ "$machine" = "$2" ] || { echo "::error::$1 hat den Maschinentyp $machine statt $2"; exit 1; }
            echo "$1: Maschinentyp $machine"
          }
          check_machine win-unpacked/PDF-Tool.exe 8664
          check_machine win-arm64-unpacked/PDF-Tool.exe aa64

      # Builds of pull requests (possibly from forks) get a name of their own, so they cannot be
      # mistaken for the builds of the repository's own branches. The patterns name exactly the four
      # .exe files checked above, so no other file from dist/ ends up in the artifact or the release.
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('PDF-Tool-Windows-PR-{0}', github.event.number) || 'PDF-Tool-Windows' }}
          path: |
            desktop/dist/PDF-Tool-Setup-*-x64.exe
            desktop/dist/PDF-Tool-Setup-*-arm64.exe
            desktop/dist/PDF-Tool-*-portable-x64.exe
            desktop/dist/PDF-Tool-*-portable-arm64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Testergebnisse hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-report
          path: |
            desktop/playwright-report/
            desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: GitHub Release erstellen
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false

      # On a tag push the tag is the release (its version was checked in the windows job). On a
      # manual run the tag is created from desktop/package.json – but never moved: an existing
      # tag means this version was already released.
      - name: Tag bestimmen
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./desktop/package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::Den Tag $tag gibt es schon – für ein neues Release erst die Version in desktop/package.json erhöhen."
              exit 1
            fi
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: PDF-Tool-Windows
          path: release

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: PDF-Tool ${{ steps.tag.outputs.name }}
          files: |
            release/PDF-Tool-Setup-*-x64.exe
            release/PDF-Tool-Setup-*-arm64.exe
            release/PDF-Tool-*-portable-x64.exe
            release/PDF-Tool-*-portable-arm64.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          # GitHub shows every line break in a release body as one, so a paragraph stays on one line
          # (wrap only where the text should break).
          body: |
            PDFs zusammenführen und teilen – komplett lokal, ohne Upload.

            **Windows-App herunterladen** (unten unter *Assets*) – eine der vier Dateien genügt:

            | | die meisten PCs (Intel/AMD) | Geräte mit ARM-Prozessor (z. B. Snapdragon) |
            |---|---|---|
            | **Installer** mit Startmenü- und Desktop-Verknüpfung | `PDF-Tool-Setup-…-x64.exe` | `PDF-Tool-Setup-…-arm64.exe` |
            | **Portable Version**, läuft ohne Installation, z. B. vom USB-Stick | `PDF-Tool-…-portable-x64.exe` | `PDF-Tool-…-portable-arm64.exe` |

            Welche Variante passt, steht unter *Einstellungen → System → Info* bei „Systemtyp“:
            „x64-basierter Prozessor“ → **x64**, „ARM-basierter Prozessor“ → **arm64**.

            Windows 10 auf ARM kann nur die arm64-Variante ausführen; 32-Bit-Windows wird nicht unterstützt. Die arm64-Variante wird automatisch mitgebaut, aber nicht auf ARM-Hardware getestet.

            Die App ist nicht signiert. Beim ersten Start zeigt Windows deshalb „Der Computer wurde durch Windows geschützt“: auf **„Weitere Informationen“** und dann **„Trotzdem ausführen“** klicken.
            Details stehen in der README unter „Windows-Desktop-App“.
