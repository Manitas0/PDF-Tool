name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --omit=optional

      # `git status` instead of `git diff`: it also reports files that `npm run vendor` creates
      # but that were never committed (untracked), which the deployed page would be missing.
      - name: Prüfen, ob vendor/ aktuell ist
        run: |
          npm run vendor
          if [ -n "$(git status --porcelain -- vendor)" ]; then
            git status --short -- vendor
            echo "::error::vendor/ passt nicht zu package-lock.json – bitte 'npm run vendor' ausführen und die Änderungen (auch neue Dateien) einchecken."
            exit 1
          fi

      - name: Unit-Tests
        run: npm test

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests
        run: npm run test:e2e

      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
